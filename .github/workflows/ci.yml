name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    name: Test & Build (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['18.x', '20.x', '22.x']

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run Tests
        run: npm run test:ci

      - name: Production Bundle Build
        run: npm run build

      - name: Verify Package Dry-Run
        run: npm run pack:dry

      - name: Run Pack Smoke Test
        run: npm run pack:smoke

      - name: Self-Check CLI Binary Execution
        run: node dist/cli.js check --config tests/fixtures/scenarios/all-match/specsync.json
